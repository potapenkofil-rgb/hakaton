<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Топливный узел 2035–2040</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Топливный узел 2035–2040</h1>
  <div class="bar">
    <label>План <input id="plan-id" value="base-v1"></label>
    <label>Сценарий <select id="scenario"></select></label>
    <button id="btn-calc" class="primary">Пересчитать</button>
    <button id="btn-compare">Сравнить BASE / STRESS</button>
    <button id="btn-save">Сохранить</button>
    <label>Открыть <select id="plan-list"></select></label>
    <button id="btn-open">Открыть</button>
    <button id="btn-csv">CSV</button>
    <button id="btn-xlsx">XLSX</button>
  </div>
  <div id="status" class="status"></div>
</header>

<main>
  <div id="error" class="error hidden"></div>

  <section>
    <h2>Каналы поставки <span class="hint">данные организаторов, менять нельзя</span></h2>
    <table id="sources" class="compact"></table>
  </section>

  <section>
    <h2>План: заказы и брони, т/год <span class="hint">в каждой ячейке: заказ / бронь</span></h2>
    <table id="editor" class="editor"></table>
    <div class="row">
      <fieldset>
        <legend>Инвестиции</legend>
        <label><input type="checkbox" id="en-on"> Earth-New: опцион в <select id="en-option"></select> исполнение в <select id="en-exercise"></select> <span class="hint">90 + 270, мощность через 24 мес</span></label><br>
        <label><input type="checkbox" id="isru-on"> Lunar-ISRU: финансирование 1250 по годам <span id="isru-years"></span> <span class="hint">до 2038, +70/год</span></label><br>
        <label><input type="checkbox" id="zbo-on"> ZBO: оплата 180 в <select id="zbo-year"></select> <span class="hint">120 т, потери 1,2 %, +12/год</span></label>
      </fieldset>
      <fieldset>
        <legend>Запас на 1 января 2035</legend>
        <label>Тонн <input id="init-stock" type="number" min="0" step="0.1" value="15"></label>
        <label>Стоимость, млн <input id="init-cost" type="number" min="0" step="0.1" value="133.5"></label>
        <label>Откуда <select id="init-source"></select></label>
      </fieldset>
    </div>
  </section>

  <section id="sec-violations">
    <h2>Нарушения <span id="viol-count" class="hint"></span></h2>
    <table id="violations" class="compact"></table>
    <div id="warnings" class="hint"></div>
  </section>

  <section>
    <h2>Баланс по годам <span id="res-scenario" class="hint"></span></h2>
    <table id="balance" class="compact"></table>
  </section>

  <section>
    <h2>Деньги по годам, млн</h2>
    <table id="finance" class="compact"></table>
    <div id="totals" class="totals"></div>
  </section>

  <section>
    <h2>Поставки по каналам</h2>
    <table id="schedule" class="compact"></table>
  </section>

  <section id="sec-compare" class="hidden">
    <h2>Сравнение сценариев</h2>
    <table id="compare-totals" class="compact"></table>
    <table id="compare-yearly" class="compact"></table>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
