<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Synthetic supply, demand and service example</title><desc id="d">Documentation-only synthetic chart; not a case solution.</desc><rect width="900" height="520" fill="white"/><text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="20">SYNTHETIC EXAMPLE — NOT A CASE SOLUTION</text><text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="17">Supply, demand and service</text><line x1="90" y1="440" x2="840" y2="440" stroke="black"/><line x1="90" y1="90" x2="90" y2="440" stroke="black"/><polyline points="120,360 340,300 560,240 780,180" fill="none" stroke="#1f77b4" stroke-width="3"/><polyline points="120,360 340,320 560,260 780,200" fill="none" stroke="#ff7f0e" stroke-width="3"/><polyline points="120,340 340,300 560,220 780,160" fill="none" stroke="#2ca02c" stroke-width="3"/><g font-family="sans-serif" font-size="14"><text x="120" y="465">P1</text><text x="340" y="465">P2</text><text x="560" y="465">P3</text><text x="780" y="465">P4</text><text x="120" y="495">Illustrative values only; no competition data are used.</text><text x="650" y="110" fill="#1f77b4">Demand</text><text x="650" y="132" fill="#ff7f0e">Served demand</text><text x="650" y="154" fill="#2ca02c">Available supply</text></g></svg>
